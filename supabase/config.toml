# Konfigurasi Supabase CLI untuk LumaWall.
#
# Proyek ini terpisah dari NexShop dan AkunTuntas dengan sengaja: pesanan dan
# token unduhan LumaWall tidak boleh tercampur dengan data penjualan top-up
# atau data pembukuan. Kalau salah satu perlu dipulihkan, dipindahkan, atau
# dihapus, yang lain tidak ikut terbawa.
#
# Yang dipakai dari proyek ini hanya dua hal: tabel untuk pesanan + token
# unduhan, dan satu bucket privat untuk berkas installer.

project_id = "qqefvysewtugajsrqvsu"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
